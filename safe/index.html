<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input pass</title>
    <style>
        * { box-sizing: border-box; }
        body {
            max-width: 700px;
            margin: 50px auto;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #222;
            background: #f4f4f4;
        }
        .panel {
            padding: 24px;
            background: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .06);
        }
        h1 { margin-top: 0; font-size: 26px; }
        .login-row { display: flex; gap: 10px; }
        input, button {
            min-height: 44px;
            padding: 10px 12px;
            font-size: 16px;
        }
        input {
            width: 100%;
            border: 1px solid #bbb;
            letter-spacing: 5px;
        }
        button {
            flex-shrink: 0;
            border: 0;
            background: #222;
            color: #fff;
            cursor: pointer;
        }
        button:hover { background: #444; }
        #message { min-height: 24px; margin-bottom: 0; }
        .error { color: #c62828; }
        .success { color: #26743b; }
        #data-section { display: none; margin-top: 24px; }
        #data-list { padding-left: 22px; overflow-wrap: anywhere; }
        #data-list li { padding: 5px 0; font-size: 16px; }
        @media (max-width: 480px) {
            body { margin: 16px auto; padding: 12px; }
            .panel { padding: 18px; }
            .login-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <main class="panel">
        <form id="password-form">
            <div class="login-row">
                <input
                    id="password"
                    type="password"
                    inputmode="numeric"
                    pattern="[0-9]{3}"
                    maxlength="5"
                    aria-label="pass"
                    autocomplete="on"
                    required
                >
                <button type="submit">Open</button>
            </div>
        </form>
        <p id="message" role="status" aria-live="polite"></p>

        <section id="data-section">
            <h2>Content</h2>
            <ul id="data-list"></ul>
        </section>

    </main><center><a href="../index.html" style="color: #999; outline: none; padding-top: 5px; display: block; text-decoration: none;">< back</a></center>

    <script>
        const CORRECT_PASSWORD = '312';
        const form = document.getElementById('password-form');
        const passwordInput = document.getElementById('password');
        const message = document.getElementById('message');
        const dataSection = document.getElementById('data-section');
        const dataList = document.getElementById('data-list');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            dataSection.style.display = 'none';
            dataList.replaceChildren();

            if (passwordInput.value !== CORRECT_PASSWORD) {
                message.textContent = 'Incorrect password.';
                message.className = 'error';
                passwordInput.select();
                return;
            }

            message.textContent = 'The password is correct. Loading data...';
            message.className = '';

            try {
                const response = await fetch('./data.txt', { cache: 'no-store' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const text = await response.text();
                const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');

                for (const line of lines) {
                    const item = document.createElement('li');
                    item.textContent = line;
                    dataList.appendChild(item);
                }

                dataSection.style.display = 'block';
                message.textContent = 'Данные загружены.';
                message.className = 'success';
            } catch (error) {
                message.textContent = 'Не удалось загрузить data.txt. Убедитесь, что он находится рядом с index.html на сервере.';
                message.className = 'error';
                console.error(error);
            }
        });
    </script>
</body>
</html>
