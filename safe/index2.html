<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Защищенный Менеджер Паролей</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">

    <!-- Экран ввода мастер-пароля -->
    <div id="authScreen" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-2 text-slate-800">🔒 Вход в хранилище</h2>
        <p class="text-sm text-slate-500 mb-4">Введите ваш секретный мастер-пароль</p>
        <input type="password" id="accessPassword" placeholder="Мастер-пароль" class="w-full p-3 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="checkAuth()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">Разблокировать</button>
        <p id="authError" class="text-red-500 mt-2 text-sm hidden">Неверный мастер-пароль!</p>
    </div>

    <!-- Основной интерфейс -->
    <div id="appScreen" class="max-w-6xl mx-auto hidden">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-extrabold text-slate-800">🔐 Менеджер Паролей (Зашифровано)</h1>
            <div class="space-x-3">
                <button onclick="openModal()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700 transition">+ Добавить запись</button>
                <button onclick="logout()" class="bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-bold hover:bg-slate-400 transition">Заблокировать</button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <table class="w-full border-collapse text-left">
                <thead>
                    <tr class="bg-slate-200 text-slate-700 uppercase text-xs font-semibold">
                        <th class="p-4">Ссылка</th>
                        <th class="p-4">Логин</th>
                        <th class="p-4">Пароль</th>
                        <th class="p-4">Доп. информация</th>
                        <th class="p-4">Дата изменения</th>
                        <th class="p-4 text-center">Действия</th>
                    </tr>
                </thead>
                <tbody id="passwordTable" class="divide-y divide-slate-200 text-sm text-slate-600">
                    <!-- Данные подгружаются через JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="passwordModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-xl w-full max-w-md shadow-lg">
            <h2 id="modalTitle" class="text-xl font-bold mb-4">Новая запись</h2>
            <input type="hidden" id="recordId">
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Ссылка</label>
            <input type="text" id="modalLink" class="w-full p-2 border rounded mb-3">
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Логин</label>
            <input type="text" id="modalLogin" class="w-full p-2 border rounded mb-3">
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Пароль</label>
            <input type="text" id="modalPassword" class="w-full p-2 border rounded mb-3">
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Доп. информация</label>
            <textarea id="modalInfo" class="w-full p-2 border rounded mb-4"></textarea>
            
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-300 rounded font-bold hover:bg-slate-400">Отмена</button>
                <button onclick="saveRecord()" class="px-4 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://life-extrim.ru/api.php';
        let currentPassword = sessionStorage.getItem('app_password') || '';

        // Автоматический вход в рамках сессии браузера, если пароль уже вводился
        if (currentPassword) {
            verifyAndOpen(currentPassword);
        }

        async function checkAuth() {
            const passInput = document.getElementById('accessPassword').value;
            await verifyAndOpen(passInput);
        }

        async function verifyAndOpen(password) {
            try {
                const res = await fetch(API_URL, {
                    headers: { 'X-Password': password }
                });
                if (res.ok) {
                    currentPassword = password;
                    sessionStorage.setItem('app_password', currentPassword);
                    document.getElementById('authScreen').classList.add('hidden');
                    document.getElementById('appScreen').classList.remove('hidden');
                    loadPasswords();
                } else {
                    document.getElementById('authError').classList.remove('hidden');
                    sessionStorage.removeItem('app_password');
                }
            } catch (err) {
                alert('Ошибка соединения с сервером life-extrim.ru');
            }
        }

        function logout() {
            sessionStorage.removeItem('app_password');
            location.reload();
        }

        async function loadPasswords() {
            try {
                const res = await fetch(API_URL, {
                    headers: { 'X-Password': currentPassword }
                });
                const data = await res.json();
                const tbody = document.getElementById('passwordTable');
                tbody.innerHTML = '';

                data.forEach(item => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50">
                            <td class="p-4"><a href="${item.link}" target="_blank" class="text-blue-600 underline">${item.link}</a></td>
                            <td class="p-4">${item.login}</td>
                            <td class="p-4 font-mono">${item.password}</td>
                            <td class="p-4">${item.info || ''}</td>
                            <td class="p-4 text-xs text-slate-400">${item.updated_at || ''}</td>
                            <td class="p-4 text-center space-x-2">
                                <button onclick="editRecord(${item.id}, '${item.link}', '${item.login}', '${item.password}', \`${item.info || ''}\`)" class="text-blue-500 font-bold hover:underline">Изменить</button>
                                <button onclick="deleteRecord(${item.id})" class="text-red-500 font-bold hover:underline">Удалить</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Ошибка загрузки данных', err);
            }
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = 'Новая запись';
            document.getElementById('recordId').value = '';
            document.getElementById('modalLink').value = '';
            document.getElementById('modalLogin').value = '';
            document.getElementById('modalPassword').value = '';
            document.getElementById('modalInfo').value = '';
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        function editRecord(id, link, login, password, info) {
            document.getElementById('modalTitle').innerText = 'Редактировать запись';
            document.getElementById('recordId').value = id;
            document.getElementById('modalLink').value = link;
            document.getElementById('modalLogin').value = login;
            document.getElementById('modalPassword').value = password;
            document.getElementById('modalInfo').value = info;
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('passwordModal').classList.add('hidden');
        }

        async function saveRecord() {
            const id = document.getElementById('recordId').value;
            const link = document.getElementById('modalLink').value;
            const login = document.getElementById('modalLogin').value;
            const password = document.getElementById('modalPassword'].value;
            const info = document.getElementById('modalInfo').value;

            await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Password': currentPassword
                },
                body: JSON.stringify({ id: id ? id : null, link, login, password, info })
            });

            closeModal();
            loadPasswords();
        }

        async function deleteRecord(id) {
            if (confirm('Точно удалить эту запись?')) {
                await fetch(`${API_URL}?id=${id}`, {
                    method: 'DELETE',
                    headers: { 'X-Password': currentPassword }
                });
                loadPasswords();
            }
        }
    </script>
</body>
</html>
