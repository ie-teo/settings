<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CryptoJS для шифрования на стороне клиента -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">

    <!-- Master Password Screen -->
    <div id="authScreen" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-2 text-slate-800">🔒 Vault Login</h2>
        <p class="text-sm text-slate-500 mb-4">Enter your secret master password</p>
        <input type="password" id="accessPassword" placeholder="Master Password" class="w-full p-3 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="checkAuth()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">Unlock</button>
        <p id="authError" class="text-red-500 mt-2 text-sm hidden">Invalid master password!</p>
    </div>

    <!-- Main Dashboard -->
    <div id="appScreen" class="max-w-6xl mx-auto hidden">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-extrabold text-slate-800">🔐 Password Manager (Encrypted via Supabase)</h1>
            <div class="space-x-3">
                <button onclick="openModal()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700 transition">+ Add Item</button>
                <button onclick="logout()" class="bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-bold hover:bg-slate-400 transition">Lock Vault</button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <table class="w-full border-collapse text-left">
                <thead>
                    <tr class="bg-slate-200 text-slate-700 uppercase text-xs font-semibold">
                        <th class="p-4">URL</th>
                        <th class="p-4">Username / Login</th>
                        <th class="p-4">Password</th>
                        <th class="p-4">Notes / Info</th>
                        <th class="p-4 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="passwordTable" class="divide-y divide-slate-200 text-sm text-slate-600">
                    <!-- Loaded dynamically via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="passwordModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-xl w-full max-w-md shadow-lg">
            <h2 id="modalTitle" class="text-xl font-bold mb-4">New Entry</h2>
            <input type="hidden" id="recordIndex">
            
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">URL / Link</label>
            <input type="text" id="modalLink" class="w-full p-2 border rounded mb-3">
            
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Username / Login</label>
            <input type="text" id="modalLogin" class="w-full p-2 border rounded mb-3">
            
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Password</label>
            <input type="text" id="modalPassword" class="w-full p-2 border rounded mb-3">
            
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Additional Info</label>
            <textarea id="modalInfo" class="w-full p-2 border rounded mb-4"></textarea>
            
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-300 rounded font-bold hover:bg-slate-400">Cancel</button>
                <button onclick="saveRecord()" class="px-4 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация Supabase (используется ваш публичный anon-ключ)
        const SUPABASE_URL = 'https://holjxwseswvbdgtdnpzo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvbGp4d3Nlc3d2YmRndGRucHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODExNjgsImV4cCI6MjEwODQ1NzE2OH0.qYWpGF6hdgRG5-THMxcSCtfYseILKqTO_ZqJ-oO5ZBU';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // Скрытый мастер-пароль (зашифрован в Base64, чтобы не лежал открытым текстом)
        const _pEncoded = 'MzEy'; // '312' в base64
        function getMasterPass() {
            return atob(_pEncoded);
        }

        let decryptedData = [];

        if (sessionStorage.getItem('vault_unlocked') === 'true') {
            openApp();
        }

        async function checkAuth() {
            const passInput = document.getElementById('accessPassword').value;
            if (passInput === getMasterPass()) {
                sessionStorage.setItem('vault_unlocked', 'true');
                openApp();
            } else {
                document.getElementById('authError').classList.remove('hidden');
            }
        }

        async function openApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            await loadPasswords();
        }

        function logout() {
            sessionStorage.removeItem('vault_unlocked');
            location.reload();
        }

        async function loadPasswords() {
            try {
                const { data, error } = await supabaseClient
                    .from('passwords')
                    .select('*')
                    .limit(1);

                if (error) {
                    console.error('Supabase fetch error:', error);
                    return;
                }

                if (data && data.length > 0 && data[0].data) {
                    const bytes = CryptoJS.AES.decrypt(data[0].data, getMasterPass());
                    const decryptedString = bytes.toString(CryptoJS.enc.Utf8);
                    
                    if (decryptedString) {
                        decryptedData = JSON.parse(decryptedString);
                    } else {
                        decryptedData = [];
                    }
                } else {
                    decryptedData = [];
                }

                renderTable();
            } catch (err) {
                console.error('Error loading data from Supabase:', err);
            }
        }

        async function saveToCloud() {
            try {
                const encryptedData = CryptoJS.AES.encrypt(JSON.stringify(decryptedData), getMasterPass()).toString();

                const { data: existing, error: selectError } = await supabaseClient
                    .from('passwords')
                    .select('id')
                    .limit(1);

                if (selectError) {
                    console.error('Select error:', selectError);
                }

                if (existing && existing.length > 0) {
                    const { error: updateError } = await supabaseClient
                        .from('passwords')
                        .update({ data: encryptedData, updated_at: new Date() })
                        .eq('id', existing[0].id);

                    if (updateError) console.error('Update error:', updateError);
                } else {
                    const { error: insertError } = await supabaseClient
                        .from('passwords')
                        .insert([{ data: encryptedData }]);

                    if (insertError) console.error('Insert error:', insertError);
                }
            } catch (err) {
                console.error('Error saving to Supabase:', err);
                alert('Error saving data to cloud!');
            }
        }

        function renderTable() {
            const tbody = document.getElementById('passwordTable');
            tbody.innerHTML = '';

            decryptedData.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-4"><a href="${item.link}" target="_blank" class="text-blue-600 underline">${item.link}</a></td>
                        <td class="p-4">${item.login}</td>
                        <td class="p-4 font-mono">${item.password}</td>
                        <td class="p-4">${item.info || ''}</td>
                        <td class="p-4 text-center space-x-2">
                            <button onclick="editRecord(${index})" class="text-blue-500 font-bold hover:underline">Edit</button>
                            <button onclick="deleteRecord(${index})" class="text-red-500 font-bold hover:underline">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = 'New Entry';
            document.getElementById('recordIndex').value = '';
            document.getElementById('modalLink').value = '';
            document.getElementById('modalLogin').value = '';
            document.getElementById('modalPassword').value = '';
            document.getElementById('modalInfo').value = '';
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        function editRecord(index) {
            const item = decryptedData[index];
            document.getElementById('modalTitle').innerText = 'Edit Entry';
            document.getElementById('recordIndex').value = index;
            document.getElementById('modalLink').value = item.link;
            document.getElementById('modalLogin').value = item.login;
            document.getElementById('modalPassword').value = item.password;
            document.getElementById('modalInfo').value = item.info || '';
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('passwordModal').classList.add('hidden');
        }

        async function saveRecord() {
            const index = document.getElementById('recordIndex').value;
            const newItem = {
                link: document.getElementById('modalLink').value,
                login: document.getElementById('modalLogin').value,
                password: document.getElementById('modalPassword').value,
                info: document.getElementById('modalInfo').value
            };

            if (index === '') {
                decryptedData.push(newItem);
            } else {
                decryptedData[index] = newItem;
            }

            closeModal();
            renderTable();
            await saveToCloud();
        }

        async function deleteRecord(index) {
            if (confirm('Are you sure you want to delete this entry?')) {
                decryptedData.splice(index, 1);
                renderTable();
                await saveToCloud();
            }
        }
    </script>
</body>
</html>
