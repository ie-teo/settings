<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CryptoJS для шифрования на стороне клиента -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Firebase SDK (Modular v13) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC22BB4AIsCxJndZcH-riSwiQ0VsrjWuCE",
            authDomain: "my-vault-36.firebaseapp.com",
            projectId: "my-vault-36",
            storageBucket: "my-vault-36.firebasestorage.app",
            messagingSenderId: "117687816843",
            appId: "1:117687816843:web:f51b0b4a8bd9263fae7a8e",
            measurementId: "G-LSNCV555GL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const _pEncoded = 'MzEy';
        function getMasterPass() {
            return atob(_pEncoded);
        }

        let decryptedData = [];

        window.checkAuth = async function() {
            const passInput = document.getElementById('accessPassword').value;
            if (passInput === getMasterPass()) {
                sessionStorage.setItem('vault_unlocked', 'true');
                openApp();
            } else {
                document.getElementById('authError').classList.remove('hidden');
            }
        }

        async function openApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            await loadPasswords();
        }

        window.logout = function() {
            sessionStorage.removeItem('vault_unlocked');
            location.reload();
        }

        async function loadPasswords() {
            try {
                const docRef = doc(db, "vaults", "my_passwords");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists() && docSnap.data().data) {
                    const encrypted = docSnap.data().data;
                    const bytes = CryptoJS.AES.decrypt(encrypted, getMasterPass());
                    const decryptedString = bytes.toString(CryptoJS.enc.Utf8);
                    decryptedData = decryptedString ? JSON.parse(decryptedString) : [];
                } else {
                    decryptedData = [];
                }
                renderTable(decryptedData);
            } catch (err) {
                console.error('Error loading from Firebase:', err);
            }
        }

        async function saveToCloud() {
            try {
                const encryptedData = CryptoJS.AES.encrypt(JSON.stringify(decryptedData), getMasterPass()).toString();
                const docRef = doc(db, "vaults", "my_passwords");
                await setDoc(docRef, { data: encryptedData, updated_at: new Date().toISOString() });
            } catch (err) {
                console.error('Error saving to Firebase:', err);
                alert('Error saving data to cloud!');
            }
        }

        // Рендер таблицы и мобильных карточек
        window.renderTable = function(dataToRender = decryptedData) {
            const tbody = document.getElementById('passwordTable');
            const mobileCards = document.getElementById('mobileCards');
            tbody.innerHTML = '';
            if (mobileCards) mobileCards.innerHTML = '';

            if (dataToRender.length === 0) {
                const emptyMsg = `<div class="p-6 text-center text-slate-400">No records found</div>`;
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">No records found</td></tr>`;
                if (mobileCards) mobileCards.innerHTML = emptyMsg;
                return;
            }

            dataToRender.forEach((item) => {
                const originalIndex = decryptedData.indexOf(item);
                const rawLink = item.link || '';
                const displayLink = rawLink ? (rawLink.startsWith('http://') || rawLink.startsWith('https://') ? rawLink : `https://${rawLink}`) : '#';

                // Десктопная строка таблицы
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-4 break-all"><a href="${displayLink}" target="_blank" class="text-blue-600 underline hover:text-blue-800">${item.link || '-'}</a></td>
                        <td class="p-4 break-all">${item.login || '-'}</td>
                        <td class="p-4 font-mono break-all">${item.password || '-'}</td>
                        <td class="p-4 break-words">${item.info || ''}</td>
                        <td class="p-4 text-center space-x-2 whitespace-nowrap">
                            <button onclick="editRecord(${originalIndex})" class="text-blue-600 font-bold hover:underline">Edit</button>
                            <button onclick="deleteRecord(${originalIndex})" class="text-red-500 font-bold hover:underline">Delete</button>
                        </td>
                    </tr>
                `;

                // Мобильная карточка
                if (mobileCards) {
                    mobileCards.innerHTML += `
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2.5">
                            <div class="flex items-start justify-between gap-2 border-b border-slate-100 pb-2">
                                <a href="${displayLink}" target="_blank" class="text-blue-600 font-bold underline break-all text-sm sm:text-base">${item.link || 'No URL'}</a>
                                <div class="flex items-center gap-2 shrink-0">
                                    <button onclick="editRecord(${originalIndex})" class="px-2.5 py-1 text-xs font-bold text-blue-600 bg-blue-50 rounded-lg hover:bg-blue-100">Edit</button>
                                    <button onclick="deleteRecord(${originalIndex})" class="px-2.5 py-1 text-xs font-bold text-red-600 bg-red-50 rounded-lg hover:bg-red-100">Delete</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 gap-1.5 text-xs">
                                <div>
                                    <span class="font-semibold text-slate-400 uppercase tracking-wider block text-[10px]">Username / Login</span>
                                    <span class="text-slate-800 font-medium break-all text-sm">${item.login || '-'}</span>
                                </div>
                                <div>
                                    <span class="font-semibold text-slate-400 uppercase tracking-wider block text-[10px]">Password</span>
                                    <span class="font-mono text-slate-900 bg-slate-100 px-2 py-1 rounded inline-block break-all text-sm mt-0.5">${item.password || '-'}</span>
                                </div>
                                ${item.info ? `
                                <div>
                                    <span class="font-semibold text-slate-400 uppercase tracking-wider block text-[10px]">Notes</span>
                                    <span class="text-slate-600 break-words text-sm">${item.info}</span>
                                </div>` : ''}
                            </div>
                        </div>
                    `;
                }
            });
        }

        // Функция поиска по вводу
        window.filterPasswords = function() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = decryptedData.filter(item => {
                return (item.link && item.link.toLowerCase().includes(query)) ||
                       (item.login && item.login.toLowerCase().includes(query)) ||
                       (item.info && item.info.toLowerCase().includes(query));
            });
            renderTable(filtered);
        }

        window.openModal = function() {
            document.getElementById('modalTitle').innerText = 'New Entry';
            document.getElementById('recordIndex').value = '';
            document.getElementById('modalLink').value = '';
            document.getElementById('modalLogin').value = '';
            document.getElementById('modalPassword').value = '';
            document.getElementById('modalInfo').value = '';
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        window.editRecord = function(index) {
            const item = decryptedData[index];
            document.getElementById('modalTitle').innerText = 'Edit Entry';
            document.getElementById('recordIndex').value = index;
            document.getElementById('modalLink').value = item.link || '';
            document.getElementById('modalLogin').value = item.login || '';
            document.getElementById('modalPassword').value = item.password || '';
            document.getElementById('modalInfo').value = item.info || '';
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('passwordModal').classList.add('hidden');
        }

        window.saveRecord = async function() {
            const index = document.getElementById('recordIndex').value;
            const newItem = {
                link: document.getElementById('modalLink').value,
                login: document.getElementById('modalLogin').value,
                password: document.getElementById('modalPassword').value,
                info: document.getElementById('modalInfo').value
            };

            if (index === '') {
                decryptedData.push(newItem);
            } else {
                decryptedData[index] = newItem;
            }

            closeModal();
            document.getElementById('searchInput').value = ''; // сбрасываем поиск при сохранении
            renderTable();
            await saveToCloud();
        }

        window.deleteRecord = async function(index) {
            if (confirm('Are you sure you want to delete this entry?')) {
                decryptedData.splice(index, 1);
                document.getElementById('searchInput').value = ''; // сбрасываем поиск при удалении
                renderTable();
                await saveToCloud();
            }
        }

        if (sessionStorage.getItem('vault_unlocked') === 'true') {
            openApp();
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen p-3 sm:p-6 text-slate-800 antialiased">

    <!-- Master Password Screen -->
    <div id="authScreen" class="max-w-md mx-auto my-12 sm:my-20 bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-100">
        <h2 class="text-2xl font-bold mb-2 text-slate-800">🔒 Vault Login</h2>
        <p class="text-sm text-slate-500 mb-6">Enter your secret master password</p>
        <form onsubmit="event.preventDefault(); checkAuth();">
            <input type="password" id="accessPassword" placeholder="Master Password" class="w-full p-3 border border-slate-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base">
            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition active:scale-[0.99]">Unlock</button>
        </form>
        <p id="authError" class="text-red-500 mt-3 text-sm hidden text-center font-semibold">Invalid master password!</p>
    </div>

    <!-- Main Dashboard -->
    <div id="appScreen" class="max-w-6xl mx-auto hidden">
        <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center mb-5 gap-3.5">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 text-center md:text-left">🔐 Password Manager</h1>
            
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 w-full md:w-auto">
                <!-- Поле поиска -->
                <input type="text" id="searchInput" oninput="filterPasswords()" placeholder="Search vault..." class="p-2.5 border border-slate-300 rounded-xl bg-white w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm">
                
                <div class="flex gap-2">
                    <button onclick="openModal()" class="flex-1 sm:flex-initial bg-green-600 text-white px-4 py-2.5 rounded-xl font-bold hover:bg-green-700 transition whitespace-nowrap text-center text-sm shadow-sm active:scale-95">+ Add</button>
                    <button onclick="logout()" class="flex-1 sm:flex-initial bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl font-bold hover:bg-slate-300 transition whitespace-nowrap text-center text-sm shadow-sm active:scale-95">Lock</button>
                </div>
            </div>
        </div>

        <!-- Desktop View: Table -->
        <div class="hidden md:block bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full border-collapse text-left">
                <thead>
                    <tr class="bg-slate-50 text-slate-700 uppercase text-xs font-semibold border-b border-slate-200">
                        <th class="p-4 w-1/4">URL</th>
                        <th class="p-4 w-1/5">Username / Login</th>
                        <th class="p-4 w-1/5">Password</th>
                        <th class="p-4">Notes / Info</th>
                        <th class="p-4 text-center w-28">Actions</th>
                    </tr>
                </thead>
                <tbody id="passwordTable" class="divide-y divide-slate-200 text-sm text-slate-600">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>

        <!-- Mobile View: Cards -->
        <div id="mobileCards" class="grid grid-cols-1 gap-3 md:hidden">
            <!-- Loaded dynamically -->
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="passwordModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden p-4 z-50">
        <div class="bg-white p-5 sm:p-6 rounded-2xl w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto">
            <h2 id="modalTitle" class="text-xl font-bold mb-4 text-slate-800">New Entry</h2>
            <input type="hidden" id="recordIndex">
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">URL / Link</label>
                    <input type="text" id="modalLink" placeholder="e.g. google.com" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Username / Login</label>
                    <input type="text" id="modalLogin" placeholder="e.g. user@gmail.com" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Password</label>
                    <input type="text" id="modalPassword" placeholder="e.g. ••••••••" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Additional Info</label>
                    <textarea id="modalInfo" rows="3" placeholder="Notes, secret answers, PIN..." class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
            </div>
            
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeModal()" class="flex-1 sm:flex-none px-4 py-2.5 bg-slate-100 text-slate-700 rounded-lg font-bold hover:bg-slate-200 transition text-sm">Cancel</button>
                <button onclick="saveRecord()" class="flex-1 sm:flex-none px-4 py-2.5 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition text-sm">Save</button>
            </div>
        </div>
    </div>
</body>
</html>
